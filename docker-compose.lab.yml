# Lab/pilot overlay — use with base compose:
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up --build -d
#
# Repo: https://github.com/dataaispark-spec/bfsi-agents-fraud-lab
# Default: SQLite on a named volume (simplest reliable pilot).
# Set DB_BACKEND=postgres in .env to use the postgres service instead.

services:
  app:
    environment:
      - APP_VERSION=1.1.1
      - DB_BACKEND=${DB_BACKEND:-sqlite}
      - FRAUD_DB_PATH=/data/fraud_cases.db
      - AUTO_SEED=${AUTO_SEED:-true}
      - LLM_PROVIDER=${LLM_PROVIDER:-off}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=clerivon_fraud
      - DB_USER=clerivon_user
      - DB_PASSWORD=${DB_PASSWORD:-secure_password_change_in_prod}
    volumes:
      - clerivon_sqlite_data:/data
    command: ["bash", "/app/scripts/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  mcp-server:
    profiles: ["mcp"]
    environment:
      - DB_BACKEND=${DB_BACKEND:-sqlite}
      - FRAUD_DB_PATH=/data/fraud_cases.db

  postgres:
    profiles: ["postgres"]

volumes:
  clerivon_sqlite_data:
    driver: local
